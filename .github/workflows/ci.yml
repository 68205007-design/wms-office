# ทดสอบระบบจริงกับ MySQL ทุกครั้งที่ push: สร้างตาราง → seed → เปิด API → smoke test → build frontend
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wms_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/wms_db
      JWT_SECRET: ci-secret-key-that-is-long-enough-for-tests-123456
      PORT: 4000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend install
        working-directory: backend
        run: npm install
      - name: Create schema + seed
        working-directory: backend
        run: npx prisma db push && node prisma/seed.js
      - name: Start API & smoke test
        working-directory: backend
        run: |
          node src/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 1; done
          node scripts/smoke-test.js
      - name: Frontend build
        working-directory: frontend
        run: npm install && npm run build
