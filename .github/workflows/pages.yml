# Build ระบบ WMS (frontend) แล้ว deploy ขึ้น GitHub Pages
# Backend อยู่ที่ Render: https://wms-office-api.onrender.com/api
name: Deploy WMS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Build frontend
        env:
          # URL เว็บแอป Google Apps Script (ถ้าว่างจะใช้ Backend บน Render แทน)
          VITE_GAS_URL: ${{ vars.GAS_URL || 'https://script.google.com/macros/s/AKfycbxYt8dahItzZvvoqkjp4rjWYxnIyDzSBQ14HCaYxPnTMbZgNZ22YUw_39qtI3pLz2iqUw/exec' }}
          VITE_API_URL: https://wms-office-api.onrender.com/api
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Wait for artifact to register
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
