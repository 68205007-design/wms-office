# Render Blueprint สำหรับ Backend (ต้องมี MySQL ภายนอก เช่น Railway / Aiven / TiDB Cloud)
services:
  - type: web
    name: wms-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_URL
        sync: false
